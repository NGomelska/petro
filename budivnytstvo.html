<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Будуємо будинок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: будмайданчик на весь екран — яма й будинок ліворуч, техніка під'їжджає справа, баштовий кран стоїть позаду. Одна тема свідомо (мальована сцена). */
:root {
  --ink: #5a3a26;
  --cream: #fffaf2;
  --pop: #ffcf3a;
  --mint: #6cc7a8;
  --font: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font); background: #bfe8ff;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
#hint { font-size: 54px; transform-box: fill-box; transform-origin: 50% 100%; animation: tapme .7s ease-in-out infinite alternate; pointer-events: none; }
@keyframes tapme { from { transform: translateY(0) scale(1); } to { transform: translateY(10px) scale(.9); } }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
header > * { pointer-events: auto; }
.pill { background: rgba(255,250,242,.92); border-radius: 999px; box-shadow: 0 2px 10px rgba(90,58,38,.15); }
.stars { white-space: nowrap; font-weight: 900; font-size: 22px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.iconbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; font-size: 22px; cursor: pointer; }
.iconbtn:focus-visible, .play:focus-visible { outline: 4px solid var(--mint); outline-offset: 3px; }
.conf { position: fixed; left: 0; top: 0; z-index: 9; pointer-events: none; font-size: 30px; line-height: 1; }

#start { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr); place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 16px;
  background: rgba(255,250,242,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
#start .big { width: min(260px, 60vw); }
#start h1 { margin: 0; font-size: clamp(30px, 7vw, 48px); font-weight: 900; }
#start p { margin: 0 0 8px; max-width: 34ch; font-size: 18px; line-height: 1.4; }
.play { border: 0; border-radius: 999px; padding: 16px 36px; font: 900 26px var(--font); color: var(--ink); background: var(--pop); box-shadow: 0 6px 0 #d9a520, 0 10px 18px rgba(90,58,38,.25); cursor: pointer; }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9a520; }
@media (prefers-reduced-motion: reduce) { #hint { animation: none; } }
</style>

<svg id="scene" viewBox="110 0 600 700" preserveAspectRatio="xMidYMax meet" aria-label="Будмайданчик — тапай, щоб техніка працювала">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-300" x2="0" y2="560"><stop offset="0" stop-color="#9fd9ff"/><stop offset=".7" stop-color="#dff3ff"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
  </defs>
  <rect x="-3000" y="-3000" width="7000" height="3570" fill="url(#sky)"/>
  <circle cx="230" cy="170" r="42" fill="#ffe27a"/><circle cx="230" cy="170" r="62" fill="#ffe27a" opacity=".25"/>
  <g fill="#fff" opacity=".9"><ellipse cx="380" cy="200" rx="56" ry="20"/><ellipse cx="410" cy="186" rx="34" ry="22"/><ellipse cx="-40" cy="150" rx="60" ry="22"/><ellipse cx="860" cy="230" rx="60" ry="22"/></g>
  <ellipse cx="200" cy="570" rx="520" ry="80" fill="#c4e6a6"/><ellipse cx="720" cy="580" rx="460" ry="96" fill="#b4dd98"/>
  <g id="town"></g>
  <g id="crane"></g>
  <rect x="-3000" y="560" width="7000" height="3000" fill="#e6c795"/>
  <rect x="-3000" y="554" width="3146" height="12" rx="6" fill="#8bd06a"/><rect x="334" y="554" width="4000" height="12" rx="6" fill="#8bd06a"/>
  <g fill="#d6b27c"><ellipse cx="420" cy="610" rx="14" ry="6"/><ellipse cx="600" cy="640" rx="10" ry="5"/><ellipse cx="200" cy="660" rx="12" ry="5"/></g>
  <path id="hole" fill="#7a5232"/>
  <path id="concrete" fill="#a3a8b0"/>
  <rect id="slab" x="146" y="546" width="188" height="16" rx="4" fill="#b8bcc4" stroke="#5a3a26" stroke-width="3" opacity="0"/>
  <path id="pile" d="M-48 0 Q-22 -40 0 -42 Q22 -40 48 0Z" fill="#8a5d38" transform="translate(386 562) scale(0)"/>
  <g id="stack"></g>
  <g id="house"></g>
  <g id="flowers"></g>
  <g id="dump" transform="translate(900 0)"></g>
  <g id="exc" transform="translate(900 0)"></g>
  <line id="cable" stroke="#3b3b44" stroke-width="3"/>
  <g id="trolley"><rect x="-17" y="110" width="34" height="12" rx="3" fill="#55555f" stroke="#5a3a26" stroke-width="2"/></g>
  <g id="carry"></g>
  <g id="hook"><path d="M-9 -20 h18 v10 h-18z M0 -10 v6" fill="#55555f" stroke="#5a3a26" stroke-width="2.5"/></g>
  <g id="fx"></g>
  <text id="hint" x="0" y="0" text-anchor="middle" visibility="hidden">👆</text>
</svg>

<header>
  <div class="stars pill" id="stars">🏠 0</div>
  <button class="iconbtn pill" id="snd" aria-label="Звук увімкнено">🔊</button>
</header>

<div id="start">
  <svg class="big" id="startpic" viewBox="250 380 330 200" aria-hidden="true"></svg>
  <h1>Будуємо будинок</h1>
  <p>Тапай — і техніка працює: екскаватор копає, самоскид заливає, кран ставить поверхи!</p>
  <button class="play" id="go">Будуємо! ▶</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const ink = "#5a3a26";
  const eyes = (x1, x2, y, look = 0) => `<circle cx="${x1}" cy="${y}" r="7" fill="#fff"/><circle cx="${x2}" cy="${y}" r="7" fill="#fff"/>
    <circle cx="${x1 + look}" cy="${y + 1}" r="3.6" fill="#2b1a10"/><circle cx="${x2 + look}" cy="${y + 1}" r="3.6" fill="#2b1a10"/>`;

  /* ---------- техніка ---------- */
  const EXC = `<rect x="398" y="528" width="164" height="32" rx="16" fill="#4a4a52" stroke="${ink}" stroke-width="3"/>
    ${[416, 448, 480, 512, 544].map(x => `<circle cx="${x}" cy="544" r="9" fill="#9a9aa4"/>`).join("")}
    <rect x="410" y="482" width="146" height="48" rx="8" fill="#ffc93c" stroke="${ink}" stroke-width="3"/>
    <rect x="410" y="508" width="146" height="8" fill="#2b2b2b" opacity=".2"/>
    <rect x="530" y="398" width="10" height="24" rx="3" fill="#55555f"/>
    <rect x="474" y="416" width="72" height="68" rx="10" fill="#ffc93c" stroke="${ink}" stroke-width="3"/>
    <rect x="482" y="424" width="46" height="38" rx="6" fill="#bfe8ff" stroke="${ink}" stroke-width="3"/>
    ${eyes(496, 515, 442, -2)}
    <g id="boom"><rect x="280" y="470" width="158" height="16" rx="8" fill="#ffc93c" stroke="${ink}" stroke-width="3"/>
      <g id="stick"><rect x="276" y="474" width="16" height="84" rx="7" fill="#f2b62a" stroke="${ink}" stroke-width="3"/>
        <ellipse id="scoop" cx="274" cy="556" rx="17" ry="10" fill="#8a5d38" opacity="0"/>
        <path d="M294 548 L294 572 Q272 586 254 570 L262 554 Z" fill="#8a8a94" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="284" cy="478" r="5" fill="${ink}"/></g>
      <circle cx="430" cy="478" r="6" fill="${ink}"/></g>`;
  const wheel = (x, y = 526) => `<circle cx="${x}" cy="${y}" r="21" fill="#3b3b44" stroke="${ink}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="8" fill="#c9c9d2"/>`;
  const DUMP = `<rect x="340" y="500" width="292" height="24" rx="6" fill="#55555f" stroke="${ink}" stroke-width="3"/>
    <g id="bed"><path id="load" d="M352 450 Q446 410 540 450 Z" fill="#a3a8b0" stroke="${ink}" stroke-width="3"/>
      <path d="M342 448 L548 448 L540 504 L352 504 Z" fill="#ff8a3d" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M362 468 H528 M366 486 H526" stroke="#e06b20" stroke-width="5" stroke-linecap="round"/></g>
    <path d="M556 504 V448 Q556 438 566 438 H604 Q630 440 634 470 V504 Z" fill="#4a90e2" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M570 448 H602 Q620 450 624 474 H570 Z" fill="#bfe8ff" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
    ${eyes(588, 606, 461, 2)}<circle cx="628" cy="490" r="5" fill="#ffe27a" stroke="${ink}" stroke-width="2"/>
    ${wheel(386)}${wheel(470)}${wheel(592)}`;
  const zig = (x1, y1, x2, y2, n) => { let d = `M${x1} ${y1}`; for (let i = 1; i <= n; i++) d += ` L${x1 + (x2 - x1) * i / n} ${i % 2 ? y2 : y1}`; return d; };
  const CRANE = `<path d="M677 40 L160 96 M677 40 L740 96" stroke="#7a6a5a" stroke-width="2.5"/>
    <rect x="666" y="96" width="22" height="458" fill="#ffb703" stroke="${ink}" stroke-width="3"/>
    <path d="${Array.from({ length: 15 }, (_, i) => `M666 ${110 + i * 30} L688 ${125 + i * 30} L666 ${140 + i * 30}`).join(" ")}" stroke="${ink}" stroke-width="2" fill="none"/>
    <path d="M668 96 L677 40 L686 96 Z" fill="#ffb703" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
    <rect x="120" y="94" width="630" height="16" fill="#ffb703" stroke="${ink}" stroke-width="3"/>
    <path d="${zig(122, 108, 748, 96, 42)}" stroke="${ink}" stroke-width="2" fill="none"/>
    <rect x="708" y="110" width="34" height="36" rx="3" fill="#8a8a94" stroke="${ink}" stroke-width="3"/>
    <rect x="628" y="110" width="40" height="34" rx="6" fill="#4a90e2" stroke="${ink}" stroke-width="3"/>
    <rect x="634" y="116" width="28" height="20" rx="4" fill="#bfe8ff" stroke="${ink}" stroke-width="2"/>
    <circle cx="642" cy="126" r="4.5" fill="#fff"/><circle cx="655" cy="126" r="4.5" fill="#fff"/><circle cx="641" cy="127" r="2.3" fill="#2b1a10"/><circle cx="654" cy="127" r="2.3" fill="#2b1a10"/>
    <rect x="652" y="548" width="50" height="14" rx="3" fill="#8a8a94" stroke="${ink}" stroke-width="3"/>`;
  const exc = $("#exc"), dump = $("#dump");
  exc.innerHTML = EXC; dump.innerHTML = DUMP; $("#crane").innerHTML = CRANE;
  $("#startpic").innerHTML = EXC.replace(/ id="[^"]+"/g, "").replace('<g><rect x="280"', '<g transform="rotate(35 430 478)"><rect x="280"').replace('<g><rect x="276"', '<g transform="rotate(-35 284 478)"><rect x="276"');

  /* ---------- будинок ---------- */
  const WALLS = ["#ff9aa8", "#8fd0ff", "#ffd36e", "#a6e39a", "#c9b2ff", "#ffb37a"];
  const ROOFS = ["#e85d4a", "#3b7dd8", "#8a5ad6", "#2fa36b"];
  const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
  const win = (x, y) => `<rect class="win" x="${x}" y="${y}" width="26" height="28" rx="4" fill="#bfe8ff" stroke="${ink}" stroke-width="3"/><path d="M${x + 13} ${y} v28 M${x} ${y + 14} h26" stroke="${ink}" stroke-width="2"/>`;
  function floorEl(color, k) {
    const g = svgEl("g");
    g.innerHTML = `<rect x="0" y="0" width="170" height="70" rx="6" fill="${color}" stroke="${ink}" stroke-width="3"/>` +
      (k === 0 ? `${win(20, 18)}${win(124, 18)}<rect x="68" y="22" width="34" height="48" rx="6" fill="#a8693e" stroke="${ink}" stroke-width="3"/><circle cx="94" cy="48" r="3" fill="#ffe27a"/>`
               : `${win(20, 20)}${win(72, 20)}${win(124, 20)}`);
    return g;
  }
  function roofEl(color) {
    const g = svgEl("g");
    g.innerHTML = `<rect x="122" y="6" width="20" height="40" fill="#b5654a" stroke="${ink}" stroke-width="3"/>
      <path d="M-14 70 L85 0 L184 70 Z" fill="${color}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><circle cx="85" cy="40" r="10" fill="#fff" stroke="${ink}" stroke-width="3"/>`;
    return g;
  }
  const put = (el, x, y, s = 1) => el.setAttribute("transform", `translate(${x} ${y})` + (s !== 1 ? ` scale(${s})` : ""));

  /* ---------- твіни ---------- */
  const inOut = p => p < .5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p), outQ = p => 1 - (1 - p) * (1 - p), lin = p => p;
  const tween = (dur, fn, ease = inOut) => new Promise(res => {
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / (dur * 1000)); fn(ease(p)); p < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
  const wait = s => new Promise(r => setTimeout(r, s * 1000));
  const lerp = (a, b, p) => a + (b - a) * p;
  const rot = ([x, y], deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [x * c - y * s, x * s + y * c]; };

  /* ---------- майданчик ---------- */
  let D = 0, fill = 0, pileS = 0;
  function drawSite() {
    $("#hole").setAttribute("d", D > 0 ? `M150 560 L160 ${560 + D} L320 ${560 + D} L330 560Z` : "");
    if (D > 0 && fill > 0) {
      const yT = 560 + D * (1 - fill), t = (yT - 560) / D;
      $("#concrete").setAttribute("d", `M${150 + 10 * t} ${yT} L160 ${560 + D} L320 ${560 + D} L${330 - 10 * t} ${yT}Z`);
    } else $("#concrete").setAttribute("d", "");
    $("#pile").setAttribute("transform", `translate(386 562) scale(${pileS})`);
  }

  /* екскаватор: стріла (a1) і рукоять (a2) */
  let a1 = 35, a2 = -35, exX = 900;
  function drawExc() {
    exc.setAttribute("transform", `translate(${exX} 0)`);
    $("#boom").setAttribute("transform", `rotate(${a1} 430 478)`);
    $("#stick").setAttribute("transform", `rotate(${a2} 284 478)`);
  }
  function bucketPos() {
    const e = rot([-146, 0], a1), b = rot([-10, 84], a1 + a2);
    return [430 + e[0] + b[0] + exX, 478 + e[1] + b[1]];
  }
  const armTo = (t1, t2, dur) => { const s1 = a1, s2 = a2; return tween(dur, p => { a1 = lerp(s1, t1, p); a2 = lerp(s2, t2, p); drawExc(); }); };

  /* самоскид: кузов нахиляється навколо заднього борту */
  let dpX = 900, tilt = 0, loadDrop = 0;
  function drawDump() {
    dump.setAttribute("transform", `translate(${dpX} 0)`);
    $("#bed").setAttribute("transform", `rotate(${-tilt} 346 504)`);
    $("#load").setAttribute("transform", `translate(0 ${loadDrop})`);
  }

  /* кран: візок по стрілі, гак на тросі */
  let tro = 575, hookY = 200, carried = null, carriedH = 0;
  function drawCrane() {
    $("#trolley").setAttribute("transform", `translate(${tro} 0)`);
    const c = $("#cable"); c.setAttribute("x1", tro); c.setAttribute("x2", tro); c.setAttribute("y1", 122); c.setAttribute("y2", hookY - 20);
    put($("#hook"), tro, hookY);
    if (carried) put(carried, tro - 85, hookY);
  }
  const craneTo = (tx, ty, dur) => { const sx = tro, sy = hookY; return tween(dur, p => { tro = lerp(sx, tx, p); hookY = lerp(sy, ty, p); drawCrane(); }); };

  /* ---------- хід гри ---------- */
  const HOUSE_X = 155, SLAB = 546, STACK_X = 490;
  let stage = "idle", n = 0, busy = true, houses = 0, pieces = [], roofColor = ROOFS[0], smokeT = 0;
  try { houses = +localStorage.getItem("bb_houses") || 0; } catch (e) {}
  const drawStars = () => { $("#stars").textContent = `🏠 ${houses}`; };

  function hint(x, y) { const h = $("#hint"); if (x == null) { h.setAttribute("visibility", "hidden"); return; } h.setAttribute("x", x); h.setAttribute("y", y); h.setAttribute("visibility", "visible"); }
  function idleHint() {
    if (stage === "dig") hint(510, 400);
    else if (stage === "pour") hint(595, 425);
    else if (stage === "crane") hint(648, 100);
    else if (stage === "done") hint(240, 250);
  }

  function addMini(i) {
    const SPOTS = [[140, 522], [196, 514], [470, 520], [528, 512], [255, 520], [586, 522], [410, 514], [92, 516], [320, 512], [640, 516]];
    const [x, y] = SPOTS[i % SPOTS.length], w = WALLS[i % WALLS.length], r = ROOFS[i % ROOFS.length];
    const g = svgEl("g", { transform: `translate(${x} ${y})` });
    g.innerHTML = `<rect x="-17" y="-34" width="34" height="34" rx="3" fill="${w}" stroke="${ink}" stroke-width="2"/><path d="M-22 -34 L0 -52 L22 -34Z" fill="${r}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-9" y="-26" width="8" height="9" fill="#ffe27a"/><rect x="2" y="-26" width="8" height="9" fill="#ffe27a"/>`;
    $("#town").append(g);
  }

  async function newHouse() {
    busy = true; hint();
    clearInterval(smokeT);
    ["#house", "#stack", "#carry", "#fx", "#flowers"].forEach(s => { $(s).innerHTML = ""; });
    D = 0; fill = 0; pileS = 0; drawSite(); $("#slab").setAttribute("opacity", 0);
    a1 = 35; a2 = -35; exX = 900; drawExc();
    tilt = 0; loadDrop = 0; dpX = 900; drawDump();
    tro = 575; hookY = 200; carried = null; drawCrane();
    const cols = shuffle(WALLS).slice(0, 3); roofColor = ROOFS[Math.floor(Math.random() * ROOFS.length)];
    pieces = cols.map((c, k) => floorEl(c, k));
    for (let j = 2; j >= 0; j--) { $("#stack").append(pieces[j]); put(pieces[j], STACK_X, 560 - 70 * (3 - j)); }
    stage = "dig"; n = 0;
    rumble(1.6);
    await tween(1.8, p => { exX = lerp(560, 0, p); drawExc(); }, outQ);
    horn();
    busy = false; idleHint();
  }

  async function dig() {
    n++;
    scrape();
    await armTo(-7 - 5 * n, 30 + 5 * n, .55);
    $("#scoop").setAttribute("opacity", 1);
    const d0 = D; await tween(.3, p => { D = lerp(d0, 20 * n, p); drawSite(); });
    await armTo(60, -80, .6);
    $("#scoop").setAttribute("opacity", 0);
    const [bx, by] = bucketPos();
    for (let i = 0; i < 7; i++) dirt(bx + (Math.random() - .5) * 26, by, 560 - 30 * pileS);
    thud();
    const s0 = pileS; await tween(.4, p => { pileS = lerp(s0, n / 3, p); drawSite(); });
    await armTo(35, -35, .4);
    if (n === 3) {
      await wait(.2); beep3();
      await tween(1.4, p => { exX = lerp(0, 600, p); drawExc(); }, p => p * p);
      stage = "pour"; n = 0;
      beep3(); rumble(1.6);
      await tween(1.8, p => { dpX = lerp(560, 0, p); drawDump(); }, outQ);
      horn();
    }
  }
  function dirt(x, y, y1) {
    const c = svgEl("circle", { cx: x, cy: y, r: 5 + Math.random() * 4, fill: "#8a5d38" });
    $("#fx").append(c);
    tween(.35 + Math.random() * .15, p => c.setAttribute("cy", lerp(y, y1, p)), p => p * p).then(() => c.remove());
  }

  async function pour() {
    n++;
    await tween(.6, p => { tilt = 42 * p; drawDump(); });
    const stream = svgEl("path", { fill: "none", stroke: "#a3a8b0", "stroke-width": 16, "stroke-linecap": "round" });
    $("#fx").append(stream);
    pourS();
    if (n === 1) { D = 60; }
    const f0 = fill, l0 = loadDrop;
    await tween(1, p => {
      fill = lerp(f0, n / 3, p); loadDrop = lerp(l0, 16 * n, p);
      const yT = 560 + D * (1 - fill);
      stream.setAttribute("d", `M326 484 Q300 500 292 ${yT}`);
      drawSite(); drawDump();
    }, lin);
    stream.remove();
    await tween(.5, p => { tilt = 42 * (1 - p); drawDump(); });
    if (n === 3) {
      $("#slab").setAttribute("opacity", 1); pop();
      await wait(.3); rumble(1.2);
      await tween(1.4, p => { dpX = lerp(0, 620, p); drawDump(); }, p => p * p);
      stage = "crane"; n = 0;
    }
  }

  async function lift() {
    const k = n++, isRoof = k === 3;
    const el = isRoof ? $("#stack").lastElementChild : pieces[k];
    const sy = isRoof ? 490 : 560 - 70 * (3 - k);
    const dy = isRoof ? SLAB - 280 : SLAB - 70 * (k + 1);
    const carryY = Math.min(sy, dy) - 50;
    await craneTo(STACK_X + 85, Math.min(hookY, carryY), .55);
    await craneTo(STACK_X + 85, sy, .45);
    carried = el; $("#carry").append(el); clank();
    await craneTo(STACK_X + 85, carryY, .45);
    await craneTo(HOUSE_X + 85, carryY, .75);
    await craneTo(HOUSE_X + 85, dy, .5);
    carried = null; $("#house").append(el); put(el, HOUSE_X, dy); clank();
    if (k === 2) {
      const r = roofEl(roofColor); $("#stack").append(r);
      await tween(.35, p => put(r, STACK_X + 85 * (1 - p), 490 + 35 * (1 - p), p), outQ); pop();
    }
    await craneTo(HOUSE_X + 85, Math.min(dy - 60, 200), .35);
    if (isRoof) { stage = "done"; await craneTo(575, 200, .6); await finale(); }
  }

  async function finale() {
    fanfare();
    [...$("#house").querySelectorAll(".win")].forEach((w, i) => setTimeout(() => w.setAttribute("fill", "#ffe27a"), 150 + i * 110));
    const cat = svgEl("g"); cat.innerHTML = `<path d="M77 40 l2 -10 5 6 M93 40 l-2 -10 -5 6" fill="#ffa94d" stroke="${ink}" stroke-width="1.5"/><circle cx="85" cy="42" r="8" fill="#ffa94d" stroke="${ink}" stroke-width="1.5"/><circle cx="82" cy="41" r="1.4" fill="${ink}"/><circle cx="88" cy="41" r="1.4" fill="${ink}"/>`;
    setTimeout(() => { pieces[1].append(cat); meow(); }, 900);
    const FL = [[140, "#ff8fa3"], [160, "#fff"], [322, "#ffcf3a"], [342, "#c9b2ff"]];
    FL.forEach(([x, c], i) => {
      const g = svgEl("g"); g.innerHTML = `<path d="M0 0 v-14" stroke="#4f8f3e" stroke-width="3"/><circle cx="0" cy="-18" r="7" fill="${c}" stroke="${ink}" stroke-width="2"/><circle cx="0" cy="-18" r="2.5" fill="#ffcf3a"/>`;
      $("#flowers").append(g);
      tween(.4, p => put(g, x, 558, p), outQ);
    });
    smoke(); smokeT = setInterval(smoke, 900);
    confetti();
    houses++; drawStars(); try { localStorage.setItem("bb_houses", houses); } catch (e) {}
    await wait(2.4);
  }
  function smoke() {
    const c = svgEl("circle", { cx: HOUSE_X + 132, cy: SLAB - 280, r: 8, fill: "#fff", opacity: .9 });
    $("#fx").append(c);
    tween(2, p => { c.setAttribute("cy", SLAB - 280 - 70 * p); c.setAttribute("cx", HOUSE_X + 132 + 20 * p); c.setAttribute("r", 8 + 12 * p); c.setAttribute("opacity", .9 * (1 - p)); }, lin).then(() => c.remove());
  }
  function confetti() {
    const ICONS = ["⭐", "🌟", "✨", "🎈"];
    for (let i = 0; i < 26; i++) {
      const el = document.createElement("div"), x = Math.random() * innerWidth;
      el.className = "conf"; el.textContent = ICONS[i % ICONS.length]; el.style.fontSize = 22 + Math.random() * 20 + "px";
      document.body.append(el);
      el.animate([{ transform: `translate(${x}px, -40px) rotate(0)` }, { transform: `translate(${x + (Math.random() - .5) * 120}px, ${innerHeight + 40}px) rotate(${(Math.random() - .5) * 720}deg)` }],
        { duration: 1700 + Math.random() * 1200, delay: Math.random() * 500, easing: "cubic-bezier(.3,.1,.6,1)", fill: "backwards" }).onfinish = () => el.remove();
    }
  }

  async function onTap() {
    audio();
    if (busy) return;
    busy = true; hint();
    if (stage === "dig") await dig();
    else if (stage === "pour") await pour();
    else if (stage === "crane") await lift();
    else if (stage === "done") { addMini(houses - 1); await newHouse(); return; }
    busy = false; idleHint();
  }
  $("#scene").addEventListener("pointerdown", onTap);
  $("#scene").addEventListener("contextmenu", e => e.preventDefault());

  /* ---------- звуки: синтезовані ---------- */
  let ac = null, sound = true, noiseBuf = null;
  const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; };
  function tone(type, f1, f2, dur, vol = .2, when = 0) {
    const a = audio(); if (!a || !sound) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, freq, vol = .25, type = "bandpass") {
    const a = audio(); if (!a || !sound) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * 1.2, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = .8;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .04); g.gain.setValueAtTime(vol, t + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + .05);
  }
  const rumble = d => { for (let t = 0; t < d; t += .16) tone("sawtooth", 85, 62, .15, .05, t); };
  const beep3 = () => [0, .35, .7].forEach(w => tone("square", 1050, 1050, .16, .06, w));
  const horn = () => { tone("square", 440, 440, .16, .07); tone("square", 550, 550, .22, .07, .2); };
  const scrape = () => noise(.45, 450, .18);
  const pourS = () => noise(1, 380, .22, "lowpass");
  const thud = () => tone("sine", 180, 80, .16, .25);
  const clank = () => { tone("triangle", 320, 140, .14, .25); tone("square", 1200, 900, .05, .04); };
  const pop = () => tone("triangle", 600, 1200, .1, .15);
  const meow = () => { tone("sine", 700, 1000, .12, .12); tone("sine", 1000, 600, .25, .12, .12); };
  const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone("triangle", f, f, .2, .15, i * .13));

  /* ---------- старт ---------- */
  drawStars();
  for (let i = 0; i < Math.min(houses, 10); i++) addMini(i);
  drawSite(); drawExc(); drawDump(); drawCrane();
  $("#go").addEventListener("click", () => { audio(); horn(); $("#start").hidden = true; newHouse(); });
  $("#snd").addEventListener("click", () => { sound = !sound; $("#snd").textContent = sound ? "🔊" : "🔈"; $("#snd").setAttribute("aria-label", sound ? "Звук увімкнено" : "Звук вимкнено"); });
})();
</script>
