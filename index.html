/* Layout: меню з великими плитками-картинками — одна плитка = одна гра. Одна тема свідомо (дитяче меню). */
:root { --ink: #5a3a26; --font: "Nunito", "Trebuchet MS", system-ui, sans-serif; color-scheme: light; }
html, body { height: 100%; }
body { margin: 0; background: linear-gradient(#bfe8ff, #fff3d6); color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
main { min-height: 100%; box-sizing: border-box; display: grid; align-content: center; gap: 16px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: min(900px, 100vh - 40px); width: 100%; margin: 0 auto; }
@media (min-aspect-ratio: 6/5) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: min(1100px, (100vh - 40px) * 4); } }
a.tile { display: grid; grid-template-rows: minmax(0, 1fr) auto; aspect-ratio: 1; border-radius: 28px; text-decoration: none; color: var(--ink); overflow: hidden;
  box-shadow: 0 6px 0 rgba(90,58,38,.18), 0 10px 20px rgba(90,58,38,.15); background: var(--bg); transition: transform .1s; }
a.tile:active { transform: scale(.96); }
a.tile:focus-visible { outline: 5px solid #6cc7a8; outline-offset: 4px; }
.pic { display: grid; place-items: center; min-height: 0; overflow: hidden; padding: 8% 8% 0; }
.pic svg, .pic img { width: 100%; height: 100%; object-fit: contain; }
.name { font-weight: 900; font-size: clamp(15px, 3.6vw, 22px); text-align: center; padding: 6px 8px 12px; line-height: 1.15; }
</style>
